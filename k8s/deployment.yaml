apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  labels:
    app: flask
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask
  template:
    metadata:
      labels:
        app: flask
    spec:
      containers:
        - name: flask-container
          image: 180935779720.dkr.ecr.ap-south-1.amazonaws.com/flask-eks:latest
          ports:
            - containerPort: 5000

